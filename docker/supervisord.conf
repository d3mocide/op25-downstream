[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ---------------------------------------------------------------------------
# icecast2 — start first; liquidsoap and icemeta.py connect to it
# ---------------------------------------------------------------------------
[program:icecast2]
command=icecast2 -c /etc/icecast2/icecast.xml
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# op25 — main receiver process
# Reads config from /config/%(ENV_OP25_CONFIG)s
# Sends decoded PCM to UDP 127.0.0.1:23456 (consumed by liquidsoap via audio.py)
# Sends talkgroup metadata to icecast2 via icemeta.py (configured in cfg.json)
# Serves web dashboard on port 8080
# ---------------------------------------------------------------------------
[program:op25]
command=python3 /app/multi_rx.py -v %(ENV_OP25_VERBOSITY)s -c /config/%(ENV_OP25_CONFIG)s
directory=/config
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# liquidsoap — audio encoder and Icecast source client
# Calls audio.py as a subprocess to read PCM from UDP:23456
# Encodes to MP3, streams to icecast2 on localhost:8000
# ---------------------------------------------------------------------------
[program:liquidsoap]
command=liquidsoap /app/op25-docker.liq
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=8
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
